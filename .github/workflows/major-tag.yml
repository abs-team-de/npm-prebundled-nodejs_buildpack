name: Move major tag

# Apps reference the buildpack as `...nodejs_buildpack.git#v1`. Every published
# release moves that tag, so a fix reaches every app on its next restage
# without a commit in each app repository.
on:
  release:
    types: [published]

permissions:
  contents: write

# Two releases published close together must not race: the older one could
# otherwise force-push the tag back after the newer one moved it.
concurrency:
  group: major-tag
  cancel-in-progress: false

jobs:
  move:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Point the major tag at the newest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"

          # Compare published, non-prerelease releases only: a bare git tag or
          # a prerelease must not hold the major tag back. Read at run time,
          # after the concurrency group has serialised this job.
          newest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
                     --json tagName --jq '.[].tagName' \
                   | { grep -E "^${major}\.[0-9]+\.[0-9]+$" || true; } \
                   | sort -V | tail -n 1)
          if [ "$newest" != "$TAG" ]; then
            echo "::notice::$TAG is not the newest stable ${major} release (${newest:-none}); $major stays where it is"
            exit 0
          fi

          git tag --force "$major" "${TAG}^{commit}"
          git push --force origin "refs/tags/${major}"
          echo "::notice::$major now points at $TAG"
