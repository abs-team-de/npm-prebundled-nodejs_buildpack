name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run tests
        run: bats test/*.bats

  stack:
    name: test (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [cflinuxfs4, cflinuxfs5]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Bats
        run: git clone --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"

      - name: Run tests inside the ${{ matrix.stack }} rootfs
        run: >
          docker run --rm -u 2000
          -v "$PWD:/bp:ro" -v "$RUNNER_TEMP/bats:/bats:ro" -w /bp
          cloudfoundry/${{ matrix.stack }}:latest
          /bats/bin/bats test/
